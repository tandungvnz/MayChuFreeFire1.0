<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Free Fire Sensitivity</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🎯</div>
            <h2>Free Fire Sensi</h2>
            <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active" id="menuHome">
                <i class="fas fa-home"></i>
                <span>Trang chủ</span>
            </div>
            <div class="menu-item" id="menuHistory">
                <i class="fas fa-history"></i>
                <span>Lịch sử</span>
            </div>
            <div class="menu-item" id="menuInfo">
                <i class="fas fa-info-circle"></i>
                <span>Hướng dẫn</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <i class="fas fa-user-circle"></i>
                <span>Guest</span>
            </div>
            <div class="sidebar-ip" id="sidebarIp">
                <i class="fas fa-network-wired"></i>
                <span id="ipDisplay">Đang lấy IP...</span>
            </div>
            <div class="sidebar-limit">
                <i class="fas fa-tachometer-alt"></i>
                <span>Lượt còn lại: <span id="limitDisplay">5</span></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- NAVBAR -->
        <nav class="navbar">
            <button class="nav-menu-btn" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-brand">
                <span class="nav-logo">🎯</span>
                <span class="nav-title">Sensi</span>
            </div>
            <div class="nav-actions">
                <span class="nav-limit-badge" id="navLimitBadge">5</span>
            </div>
        </nav>

        <!-- STATUS BAR -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">Sẵn sàng tạo độ nhạy</span>
            <span id="statusIcon" class="status-dot green"></span>
        </div>

        <!-- HERO SECTION -->
        <div class="hero-section">
            <div class="hero-icon">🔥</div>
            <h1 class="hero-title">Tạo độ nhạy <br />Free Fire</h1>
            <p class="hero-desc">Tối ưu độ nhạy theo thiết bị của bạn</p>
        </div>

        <!-- INPUT SECTION -->
        <div class="input-section">
            <div class="input-wrapper">
                <i class="fas fa-mobile-alt input-icon"></i>
                <input 
                    type="text" 
                    id="phoneInput" 
                    placeholder="Nhập tên điện thoại..." 
                    autocomplete="off"
                />
                <button class="clear-input" id="clearInput" style="display:none;">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <div class="button-group">
                <button class="btn btn-detect" id="detectBtn">
                    <i class="fas fa-search"></i>
                    <span>Nhận diện</span>
                </button>
                <button class="btn btn-generate" id="generateBtn">
                    <i class="fas fa-bolt"></i>
                    <span>Tạo độ nhạy</span>
                </button>
            </div>
        </div>

        <!-- LOADING -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="spinner"></div>
                <p class="loading-text">Đang phân tích thiết bị...</p>
            </div>
        </div>

        <!-- DEVICE CARD -->
        <div id="deviceCard" class="card" style="display:none;">
            <div class="card-header">
                <i class="fas fa-microchip"></i>
                <span>THIẾT BỊ</span>
            </div>
            <div class="device-grid" id="deviceGrid"></div>
        </div>

        <!-- SENSITIVITY CARD -->
        <div id="sensCard" class="card" style="display:none;">
            <div class="card-header">
                <i class="fas fa-gamepad"></i>
                <span>ĐỘ NHẠY</span>
                <button class="btn-copy-mini" id="copyMiniBtn">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <div class="sensitivity-grid" id="sensGrid"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <div class="footer-limit-info">
                <i class="fas fa-info-circle"></i>
                <span>Mỗi IP được tạo <strong>5</strong> độ nhạy/ngày</span>
            </div>
            <div class="footer-copy">
                <button class="btn btn-copy" id="copyBtn">
                    <i class="fas fa-copy"></i>
                    <span>Copy độ nhạy</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast-container" id="toastContainer">
        <div class="toast" id="toast">
            <i class="fas fa-check-circle toast-icon"></i>
            <span class="toast-message" id="toastMessage">Đã sao chép!</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
